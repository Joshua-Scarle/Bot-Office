[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botoffice-agent"
version = "0.2.0"
description = "Device companion for Bot Office: lets your bots reach this computer, one grant per task, checked by its own deny-list"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["websockets>=15"]

[project.scripts]
botoffice-agent = "botoffice_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
