# ---- Custom rules (added 2026-11-22 after the history rewrite) ----
# Generic shapes only: the concrete personal values are in an out-of-repo denylist checked by
# scripts/check_denylist.sh, so this public file never names them.

[[rules]]
id = "personal-webmail-address"
description = "A personal webmail address (use you@example.test in code, docs and tests; real recipients go in config)"
regex = '''(?i)\b[a-z0-9._%+-]{3,64}@(?:gmail|googlemail|yahoo|ymail|outlook|hotmail|live|msn|icloud|me|mac|aol|gmx|proton|protonmail|pm)\.(?:com|net|me|de|co\.uk)\b'''
keywords = ["gmail", "googlemail", "yahoo", "ymail", "outlook", "hotmail", "live.", "msn.", "icloud", "@me.", "@mac.", "aol.", "gmx.", "proton", "@pm."]

[[rules]]
id = "cloudflare-workers-subdomain"
description = "A real *.workers.dev account subdomain (write <your-subdomain>.workers.dev instead)"
regex = '''(?i)\b[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev\b'''
keywords = ["workers.dev"]

[[rules]]
id = "private-rules-file"
description = "Owner standing-rules file, an installed copy, or shared data: never committed"
path = '''(?:^|/)(?:policy-pack/RULES\.md|tests/fixtures/installed-RULES-[^/]*|data/shared/.*)$'''

[[rules]]
id = "personal-life-detail"
description = "Schooling or family-role detail about a person (keep it out of the public repo)"
regex = '''(?i)\b(?:high[- ]school(?:er)?|dual[- ]enrol(?:l)?(?:ed|ment)|legal guardian|data controller)\b'''
keywords = ["high", "dual", "guardian", "controller"]
