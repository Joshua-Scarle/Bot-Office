[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botoffice"
version = "0.12.29"
description = "Self-hosted workspace for persistent, provider-agnostic agent employees"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "Pillow>=10.3",
  "uvicorn>=0.27",
  "websockets>=12",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.package-data]
botoffice = ["prompts/*.md", "static/*.html", "static/vendor/novnc/**/*", "static/vendor/novnc/*"]
